# Dataset
train_gt_dir: "dataset/train/train/GT"
train_noisy_dir: "dataset/train/train/NoisyLR"
phase2_gt_dir: "PHASE2DATASET/GT/GT"
phase2_noisy_dir: "PHASE2DATASET/NoisyLR/NoisyLR"
val_split_ratio: 0.1
gt_crop_size: 128
synthesize_prob: 0.5

# Model
in_channels: 1
out_channels: 1
width: 32
enc_blk_nums: [1, 1, 1, 14]
middle_blk_num: 1
dec_blk_nums: [1, 1, 1, 14]

# Training
batch_size: 8
num_epochs: 100
learning_rate: 0.0001
num_workers: 4
seed: 42

# Loss weights
lambda_l1: 1.0
lambda_ssim: 0.5
lambda_lpips: 0.5

# Paths
save_dir: "weights"
results_dir: "results"
